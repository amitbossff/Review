<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    font-family: 'Inter', sans-serif;
}
::-webkit-scrollbar {
    width: 6px;
}
::-webkit-scrollbar-track {
    background: #0d1117;
}
::-webkit-scrollbar-thumb {
    background: #30363d;
    border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
    background: #3d444d;
}
.gradient-text {
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.card-hover {
    transition: all 0.3s ease;
}
.card-hover:hover {
    border-color: #6366f1;
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.15);
}
.modal-animation {
    animation: modalFade 0.2s ease;
}
@keyframes modalFade {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body class="bg-[#0a0c10] text-[#e6edf3] min-h-screen">

<div class="max-w-md mx-auto p-4 md:p-6">

<!-- Header -->
<div class="text-center mb-6">
    <h1 class="text-3xl font-extrabold gradient-text mb-1">Admin Panel</h1>
    <p class="text-gray-500 text-xs">Manage Users & Counts</p>
</div>

<!-- Add User Button -->
<button onclick="openAdd()"
class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 p-3 rounded-xl font-semibold transition-all shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/40 active:scale-[0.98] mb-4">
<i class="bi bi-person-plus-fill"></i> Add User
</button>

<!-- User List -->
<div id="userList" class="space-y-2.5"></div>

</div>

<!-- Add User Modal -->
<div id="addPopup"
class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">

<div class="bg-[#161b22] border border-[#2d333b] p-5 rounded-2xl w-full max-w-sm space-y-3 modal-animation shadow-2xl">

<div class="text-center mb-1">
    <div class="w-12 h-12 bg-indigo-600/20 rounded-full flex items-center justify-center mx-auto mb-2">
        <i class="bi bi-person-plus text-indigo-400 text-xl"></i>
    </div>
    <h3 class="text-indigo-400 font-semibold">Add User</h3>
</div>

<div class="relative">
    <i class="bi bi-person absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
    <input id="addName" placeholder="Name"
    class="w-full p-2.5 pl-9 rounded-xl bg-[#0d1117] border border-[#30363d] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all text-sm">
</div>

<div class="relative">
    <i class="bi bi-at absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
    <input id="addUsername" placeholder="@username"
    class="w-full p-2.5 pl-9 rounded-xl bg-[#0d1117] border border-[#30363d] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all text-sm">
</div>

<div class="relative">
    <i class="bi bi-hash absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
    <input id="addCount" type="number" placeholder="Count"
    class="w-full p-2.5 pl-9 rounded-xl bg-[#0d1117] border border-[#30363d] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all text-sm">
</div>

<button id="addBtn"
class="w-full bg-green-600 hover:bg-green-700 p-2.5 rounded-xl font-semibold opacity-50 cursor-not-allowed transition-all active:scale-[0.97] text-sm"
disabled>
<i class="bi bi-check-circle"></i> Save
</button>

<button onclick="closeAdd()"
class="w-full bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl font-medium transition-all active:scale-[0.97] text-sm">
<i class="bi bi-x-circle"></i> Cancel
</button>

</div>
</div>

<!-- Edit User Modal -->
<div id="editPopup"
class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">

<div class="bg-[#161b22] border border-[#2d333b] p-5 rounded-2xl w-full max-w-sm space-y-3 modal-animation shadow-2xl">

<div class="text-center mb-1">
    <div class="w-12 h-12 bg-yellow-600/20 rounded-full flex items-center justify-center mx-auto mb-2">
        <i class="bi bi-pencil-square text-yellow-400 text-xl"></i>
    </div>
    <h3 class="text-yellow-400 font-semibold">Edit User</h3>
</div>

<div class="relative">
    <i class="bi bi-at absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
    <input id="editUsername" placeholder="@username"
    class="w-full p-2.5 pl-9 rounded-xl bg-[#0d1117] border border-[#30363d] focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20 outline-none transition-all text-sm">
</div>

<div class="relative">
    <i class="bi bi-hash absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
    <input id="editCount" type="number" placeholder="Count"
    class="w-full p-2.5 pl-9 rounded-xl bg-[#0d1117] border border-[#30363d] focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20 outline-none transition-all text-sm">
</div>

<button id="editBtn"
class="w-full bg-yellow-500 hover:bg-yellow-600 text-black p-2.5 rounded-xl font-semibold opacity-50 cursor-not-allowed transition-all active:scale-[0.97] text-sm"
disabled>
<i class="bi bi-check-circle"></i> Update
</button>

<button onclick="closeEdit()"
class="w-full bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl font-medium transition-all active:scale-[0.97] text-sm">
<i class="bi bi-x-circle"></i> Cancel
</button>

</div>
</div>

<!-- Toast Message -->
<div id="msg" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-lg hidden z-50">
</div>

<script>
const API = "https://mapreview1.amittgofficials.workers.dev";

let users = [];
let currentEditName = "";

async function loadUsers() {
    const res = await fetch(API + "/get-users");
    users = await res.json();
    renderUsers();
}

function renderUsers() {
    const container = document.getElementById("userList");
    container.innerHTML = "";

    if (users.length === 0) {
        container.innerHTML = `
        <div class="text-center py-8 text-gray-500">
            <i class="bi bi-people text-4xl"></i>
            <p class="mt-2 text-sm">No users found</p>
        </div>`;
        return;
    }

    users.forEach(user => {
        const userCard = document.createElement("div");
        userCard.className = "card-hover bg-[#11151c] border border-[#1f242c] p-3 rounded-xl flex justify-between items-center";
        
        userCard.innerHTML = `
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600/20 rounded-full flex items-center justify-center">
                    <i class="bi bi-person-circle text-indigo-400"></i>
                </div>
                <div>
                    <p class="font-semibold text-sm">${user.name}</p>
                    <p class="text-xs text-gray-500">${user.username} • <span class="text-blue-400">${user.count}</span></p>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="openEdit('${user.name}','${user.username}','${user.count}')"
                class="bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 p-2 rounded-lg transition-all active:scale-90 text-xs">
                <i class="bi bi-pencil"></i>
                </button>

                <button onclick="removeUser('${user.name}')"
                class="bg-red-600/20 hover:bg-red-600/30 text-red-400 p-2 rounded-lg transition-all active:scale-90 text-xs">
                <i class="bi bi-trash"></i>
                </button>
            </div>
        `;
        
        container.appendChild(userCard);
    });
}

function openAdd() {
    document.getElementById("addPopup").classList.remove("hidden");
    addName.value = "";
    addUsername.value = "";
    addCount.value = "";
    addBtn.disabled = true;
    addBtn.classList.add("opacity-50", "cursor-not-allowed");
}
function closeAdd() {
    document.getElementById("addPopup").classList.add("hidden");
}

function openEdit(name, username, count) {
    currentEditName = name;

    editUsername.value = username;
    editCount.value = count;

    document.getElementById("editPopup").classList.remove("hidden");
}
function closeEdit() {
    document.getElementById("editPopup").classList.add("hidden");
}


function toggleBtn(btn, valid) {
    btn.disabled = !valid;
    btn.classList.toggle("opacity-50", !valid);
    btn.classList.toggle("cursor-not-allowed", !valid);
}

["addName","addUsername","addCount"].forEach(id=>{
    document.getElementById(id).addEventListener("input",()=>{
        const valid =
            addName.value.trim() &&
            addUsername.value.trim() &&
            addCount.value.trim();

        toggleBtn(addBtn, valid);
    });
});

["editUsername","editCount"].forEach(id=>{
    document.getElementById(id).addEventListener("input",()=>{
        const valid =
            editUsername.value.trim() &&
            editCount.value.trim();

        toggleBtn(editBtn, valid);
    });
});


addBtn.onclick = async () => {
    addBtn.innerHTML = `<span class="spinner"></span> Adding...`;
    addBtn.disabled = true;

    await fetch(API + "/add-user", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            name: addName.value.trim(),
            username: addUsername.value.trim(),
            count: addCount.value.trim()
        })
    });

    showMsg("✔ User Added");
    closeAdd();
    loadUsers();
    
    addBtn.innerHTML = `<i class="bi bi-check-circle"></i> Save`;
};

editBtn.onclick = async () => {
    editBtn.innerHTML = `<span class="spinner"></span> Updating...`;
    editBtn.disabled = true;

    await fetch(API + "/update-user", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            name: currentEditName,
            username: editUsername.value.trim(),
            count: editCount.value.trim()
        })
    });

    showMsg("✔ User Updated");
    closeEdit();
    loadUsers();
    
    editBtn.innerHTML = `<i class="bi bi-check-circle"></i> Update`;
};

async function removeUser(name) {
    if (!confirm(`Remove user "${name}"?`)) return;
    
    await fetch(API + "/remove-user", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ name })
    });

    showMsg("✔ User Removed");
    loadUsers();
}

function showMsg(text) {
    const msg = document.getElementById("msg");
    msg.innerHTML = text;
    msg.classList.remove("hidden");
    msg.classList.add("block");
    
    setTimeout(() => {
        msg.classList.add("hidden");
        msg.classList.remove("block");
    }, 2000);
}

// Add spinner style
const style = document.createElement("style");
style.textContent = `
.spinner {
    border: 2px solid rgba(255,255,255,0.3);
    border-top: 2px solid #fff;
    border-radius: 50%;
    width: 14px;
    height: 14px;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
`;
document.head.appendChild(style);

loadUsers();
</script>

</body>
</html>
