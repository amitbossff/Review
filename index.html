<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmitTG</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    font-family: 'Inter', sans-serif;
}
.spinner {
    border: 2px solid rgba(255,255,255,0.3);
    border-top: 2px solid #fff;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
::-webkit-scrollbar {
    width: 6px;
}
::-webkit-scrollbar-track {
    background: #0d1117;
}
::-webkit-scrollbar-thumb {
    background: #30363d;
    border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
    background: #3d444d;
}
.gradient-text {
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.card-hover {
    transition: all 0.3s ease;
}
.card-hover:hover {
    border-color: #6366f1;
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.15);
}
.user-chip {
    transition: all 0.2s ease;
}
.user-chip:hover {
    border-color: #6366f1;
    background: #1a1f2e;
}
.user-chip:active {
    transform: scale(0.95);
}
.modal-animation {
    animation: modalFade 0.2s ease;
}
@keyframes modalFade {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.admin-btn {
    transition: all 0.2s ease;
}
.admin-btn:hover {
    background: rgba(99, 102, 241, 0.2);
    border-color: #6366f1;
    color: #fff;
}
.admin-btn:active {
    transform: scale(0.95);
}
</style>
</head>

<body class="bg-[#0a0c10] text-[#e6edf3] min-h-screen">

<div class="max-w-3xl mx-auto p-4 md:p-6">

<!-- Header -->
<div class="flex items-center justify-between mb-6 relative">
    <div class="flex-1"></div>
    <div class="text-center flex-1">
        <h1 class="text-3xl md:text-4xl font-extrabold gradient-text mb-1">AmitTG</h1>
    </div>
    <div class="flex-1 flex justify-end">
        <a href="http://amitxbhai.vercel.app" 
        class="admin-btn bg-[#161b22] border border-[#2d333b] rounded-xl p-2.5 text-gray-400 hover:text-white">
            <i class="bi bi-gear-fill text-lg"></i>
        </a>
    </div>
</div>

<!-- Main Card -->
<div class="bg-[#11151c] border border-[#1f242c] rounded-2xl shadow-2xl shadow-black/40 overflow-hidden">

    <!-- Input Section -->
    <div class="p-5 md:p-6 space-y-4">
        
        <!-- Comment List -->
        <div>
            <label class="flex items-center gap-2 text-sm font-medium text-gray-300 mb-2">
                <i class="bi bi-list-ol text-indigo-400"></i>
                Comment List
            </label>
            <textarea id="inputList"
            class="w-full h-32 p-3 rounded-xl bg-[#0d1117] border border-[#1f242c] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all resize-none placeholder-gray-500"
            placeholder="Paste your comment list here..."></textarea>
        </div>

        <!-- Link and Amount in One Row -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="flex items-center gap-2 text-sm font-medium text-gray-300 mb-2">
                    <i class="bi bi-link-45deg text-blue-400"></i>
                    Link
                </label>
                <input id="mainLink"
                class="w-full p-2.5 rounded-xl bg-[#0d1117] border border-[#1f242c] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all placeholder-gray-500 text-sm"
                placeholder="Enter link...">
            </div>
            <div>
                <label class="flex items-center gap-2 text-sm font-medium text-gray-300 mb-2">
                    <i class="bi bi-cash-coin text-emerald-400"></i>
                    Amount
                </label>
                <input id="amount" type="number"
                class="w-full p-2.5 rounded-xl bg-[#0d1117] border border-[#1f242c] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all placeholder-gray-500 text-sm"
                placeholder="Amount...">
            </div>
        </div>

        <!-- Users Section -->
        <div class="bg-[#0d1117] border border-[#1f242c] rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
                <h3 class="flex items-center gap-2 text-sm font-medium text-gray-300">
                    <i class="bi bi-people text-purple-400"></i>
                    Users
                </h3>
                <span class="text-xs text-gray-500">
                    <i class="bi bi-hand-index-thumb"></i> Tap to edit
                </span>
            </div>
            <div id="userItems" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-1"></div>
        </div>

        <!-- Submit Button -->
        <button onclick="splitText()"
        class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 p-3 rounded-xl font-semibold transition-all shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/40 active:scale-[0.98]">
        <i class="bi bi-magic"></i> Generate Parts
        </button>

        <!-- Send Buttons Container -->
        <div id="sendButtons" class="hidden space-y-2"></div>

        <!-- Copy All Button -->
        <button id="copyAllButton" onclick="copyAllText()"
        class="w-full bg-[#1a1f2e] hover:bg-[#222838] border border-[#2d333b] p-2.5 rounded-xl font-medium transition-all hidden text-sm">
        <i class="bi bi-clipboard-check"></i> Copy All
        </button>

    </div>

    <!-- Output Section -->
    <div class="border-t border-[#1f242c] p-5 md:p-6 space-y-4 bg-[#0f1218]">
        <div id="output" class="space-y-3"></div>
        <div id="linkSection" class="space-y-2"></div>
    </div>

</div>

<!-- Footer -->
<div class="text-center mt-4 text-xs text-gray-600">
    <i class="bi bi-shield-check"></i> Secure • <i class="bi bi-lightning-charge"></i> Fast • <i class="bi bi-check-circle"></i> Reliable
</div>

</div>

<!-- Edit User Modal -->
<div id="editModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-[#161b22] border border-[#2d333b] rounded-2xl p-5 w-full max-w-sm modal-animation shadow-2xl">
        <div class="text-center mb-3">
            <div class="w-12 h-12 bg-indigo-600/20 rounded-full flex items-center justify-center mx-auto mb-2">
                <i class="bi bi-pencil-square text-indigo-400 text-xl"></i>
            </div>
            <h3 class="text-indigo-400 font-semibold" id="editUserName"></h3>
        </div>
        <input type="number" id="editCountInput"
        class="w-full p-3 rounded-xl bg-[#0d1117] border border-[#30363d] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all mb-3 text-center"
        placeholder="Enter count">
        <div class="grid grid-cols-2 gap-2">
            <button onclick="closeEditModal()"
            class="bg-gray-700 hover:bg-gray-600 p-2.5 rounded-xl font-medium transition-all active:scale-[0.97]">
            Cancel
            </button>
            <button onclick="saveUserCount()"
            class="bg-indigo-600 hover:bg-indigo-700 p-2.5 rounded-xl font-medium transition-all active:scale-[0.97]">
            Save
            </button>
        </div>
    </div>
</div>

<script>
const API = "https://mapreview.amittgofficials.workers.dev";

const BOT_TOKEN = "8781068637:AAG3cwjTQ-Ws71uRrCqIDtv7ACe_YTqFrw4";
const CHANNEL_ID = "-1003401624590";

let users = [];
let names = [];
let nameTags = {};
let finalData = [];
let finalDataHtml = [];
let allParts = [];
let editingUserName = null;

async function loadUsers() {
    try {
        const res = await fetch(API + "/get-users");
        users = await res.json();

        names = users.map(u => u.name);

        nameTags = {};
        users.forEach(u => nameTags[u.name] = u.username);

        renderUserList();
    } catch (error) {
        console.error("Error loading users:", error);
    }
}

function renderUserList() {
    const container = document.getElementById("userItems");
    container.innerHTML = "";

    users.forEach((user, index) => {
        const userDiv = document.createElement("div");
        userDiv.className = "user-chip bg-[#161b22] border border-[#2d333b] rounded-lg px-3 py-2 cursor-pointer";
        userDiv.onclick = () => openEditModal(user.name);
        
        userDiv.innerHTML = `
            <div class="flex items-center gap-2">
                <i class="bi bi-person-circle text-indigo-400 text-sm"></i>
                <span class="text-xs font-medium text-gray-300">${user.name}</span>
                <span class="text-xs ${index === users.length - 1 ? 'text-yellow-400' : 'text-blue-400'} font-bold">
                    ${index === users.length - 1 ? 'Auto' : user.count}
                </span>
            </div>
        `;
        
        container.appendChild(userDiv);
    });
}

function openEditModal(userName) {
    editingUserName = userName;
    
    const user = users.find(u => u.name === userName);
    const isLastUser = users.length > 0 && userName === users[users.length - 1].name;
    
    document.getElementById("editUserName").textContent = `${userName} ${isLastUser ? '(Auto)' : ''}`;
    
    const input = document.getElementById("editCountInput");
    input.value = user.count;
    input.disabled = isLastUser;
    input.placeholder = isLastUser ? "Auto" : "Enter count";
    
    document.getElementById("editModal").classList.remove("hidden");
}

function closeEditModal() {
    document.getElementById("editModal").classList.add("hidden");
    editingUserName = null;
}

function saveUserCount() {
    if (!editingUserName) return;
    
    const newCount = parseInt(document.getElementById("editCountInput").value) || 0;
    
    const user = users.find(u => u.name === editingUserName);
    if (user) {
        user.count = newCount;
    }
    
    renderUserList();
    closeEditModal();
}

function parseComments(text) {
    let items = [];
    let lines = text.split('\n');
    let currentComment = null;
    
    for (let i = 0; i < lines.length; i++) {
        let originalLine = lines[i];
        let trimmedLine = originalLine.trim();
        
        if (!trimmedLine) continue;
        
        let startsWithSpace = /^\s+/.test(originalLine);
        let serialNumberMatch = trimmedLine.match(/^(\d+)[\.\)]\s+/);
        
        if (serialNumberMatch && !startsWithSpace) {
            if (currentComment) {
                items.push(currentComment);
            }
            
            let number = serialNumberMatch[1];
            let text = trimmedLine.replace(/^\d+[\.\)]\s+/, '').trim();
            
            currentComment = {
                number: number,
                text: text
            };
        } else if (startsWithSpace && currentComment) {
            currentComment.text += ' ' + trimmedLine;
        } else if (currentComment) {
            items.push(currentComment);
            currentComment = {
                number: '',
                text: trimmedLine
            };
        } else {
            currentComment = {
                number: '',
                text: trimmedLine
            };
        }
    }
    
    if (currentComment) {
        items.push(currentComment);
    }
    
    items = items.map(item => {
        item.text = item.text.replace(/\s+/g, ' ').trim();
        return item;
    });
    
    return items;
}

function splitText() {
    const output = document.getElementById("output");
    const linkSection = document.getElementById("linkSection");

    output.innerHTML = "";
    linkSection.innerHTML = "";
    finalData = [];
    finalDataHtml = [];
    allParts = [];

    let text = document.getElementById("inputList").value.trim();
    let link = document.getElementById("mainLink").value.trim();
    let amount = document.getElementById("amount").value.trim();

    if (!text) {
        alert("Please paste your comment list!");
        return;
    }

    let items = parseComments(text);

    if (items.length === 0) {
        alert("No items found in the list!");
        return;
    }

    let pointer = 0;
    let totalAssigned = 0;
    
    let userBlocks = [];

    users.forEach((user, index) => {
        let count;

        if (index === users.length - 1) {
            count = items.length - pointer;
        } else {
            count = user.count || 0;
        }

        if (count < 0) count = 0;
        if (pointer + count > items.length) {
            count = items.length - pointer;
        }

        let assigned = items.slice(pointer, pointer + count);
        pointer += count;
        totalAssigned += count;

        let tag = nameTags[user.name] || "";
        
        let blockTextMarkdown = `**${user.name} ${tag} (${assigned.length})**\n\n`;
        
        let blockTextHtml = `<b>${user.name} ${tag} (${assigned.length})</b>\n`;

        let html = `
        <div class="card-hover bg-[#0d1117] border border-[#1f242c] rounded-xl p-3">
        <h3 class="text-indigo-400 font-semibold text-sm border-b border-[#1f242c] pb-2 flex items-center gap-2">
        <i class="bi bi-person-check"></i>
        ${user.name} ${tag} <span class="text-gray-500">(${assigned.length})</span>
        </h3>
        <ul class="mt-2 space-y-1.5">`;

        assigned.forEach((item, itemIndex) => {
            let displayNumber;
            if (item.number) {
                displayNumber = item.number + ".";
            } else {
                displayNumber = (totalAssigned - assigned.length + itemIndex + 1) + ".";
            }
            
            html += `
            <li class="bg-[#11151c] border border-[#1f242c] rounded-lg p-2">
                <div class="text-xs">
                    <span class="font-bold text-white">${displayNumber}</span>
                    <span class="font-mono text-gray-400"> ${item.text}</span>
                </div>
            </li>`;

            blockTextMarkdown += `**${displayNumber}** \`${item.text}\`\n\n`;
            
            blockTextHtml += `<b>${displayNumber}</b> <code>${item.text}</code>\n\n`;
        });

        html += "</ul></div>";
        output.innerHTML += html;

        if (assigned.length > 0) {
            userBlocks.push({
                userName: user.name,
                userTag: tag,
                count: assigned.length,
                blockTextMarkdown: blockTextMarkdown,
                blockTextHtml: blockTextHtml,
                charLength: blockTextHtml.length
            });
            
            finalData.push(blockTextMarkdown);
            finalDataHtml.push(blockTextHtml);
        }
    });

    let linkAmountTextMarkdown = "";
    let linkAmountTextHtml = "";
    
    if (link) {
        linkSection.innerHTML += `
        <div class="bg-[#0d1117] border border-[#1f242c] rounded-xl p-2.5 text-center text-sm">
        <i class="bi bi-link-45deg text-blue-400"></i> ${link}
        </div>`;
        linkAmountTextMarkdown += `**----- LINK -----**\n${link}\n\n`;
        linkAmountTextHtml += `<b>----- LINK -----</b>\n${link}\n\n`;
    }

    if (amount) {
        linkSection.innerHTML += `
        <div class="bg-[#0d1117] border border-[#1f242c] rounded-xl p-2.5 text-center text-sm">
        <i class="bi bi-cash-coin text-emerald-400"></i> Amount: ${amount}
        </div>`;
        linkAmountTextMarkdown += `**----- AMOUNT -----**\n${amount}\n\n`;
        linkAmountTextHtml += `<b>----- AMOUNT -----</b>\n${amount}\n\n`;
    }
    
    if (linkAmountTextMarkdown) {
        finalData.push(linkAmountTextMarkdown);
    }
    if (linkAmountTextHtml) {
        finalDataHtml.push(linkAmountTextHtml);
    }

    const MAX_PART_LENGTH = 4000;
    
    let currentPart = [];
    let currentPartLength = 0;
    
    for (let i = 0; i < userBlocks.length; i++) {
        let block = userBlocks[i];
        
        if (currentPartLength + block.charLength <= MAX_PART_LENGTH) {
            currentPart.push(block);
            currentPartLength += block.charLength;
        } else {
            if (currentPart.length === 0) {
                currentPart.push(block);
                currentPartLength = block.charLength;
            } else {
                allParts.push(currentPart);
                currentPart = [block];
                currentPartLength = block.charLength;
            }
        }
    }
    
    if (currentPart.length > 0) {
        allParts.push(currentPart);
    }
    
    if (linkAmountTextHtml && allParts.length > 0) {
        let lastPartIndex = allParts.length - 1;
        allParts[lastPartIndex].push({
            userName: "LINK_AMOUNT",
            blockTextHtml: linkAmountTextHtml,
            blockTextMarkdown: linkAmountTextMarkdown,
            charLength: linkAmountTextHtml.length
        });
    }

    const sendButtonsContainer = document.getElementById("sendButtons");
    sendButtonsContainer.innerHTML = "";
    
    if (allParts.length > 0) {
        sendButtonsContainer.classList.remove("hidden");
        document.getElementById("copyAllButton").classList.remove("hidden");
        
        const colors = [
            "bg-blue-600 hover:bg-blue-700",
            "bg-purple-600 hover:bg-purple-700",
            "bg-orange-600 hover:bg-orange-700",
            "bg-pink-600 hover:bg-pink-700",
            "bg-teal-600 hover:bg-teal-700"
        ];
        
        allParts.forEach((part, index) => {
            let partLength = part.reduce((sum, block) => sum + block.charLength, 0);
            const color = colors[index % colors.length];
            
            sendButtonsContainer.innerHTML += `
            <button id="sendBtn${index + 1}" onclick="sendPart(${index + 1})"
            class="w-full ${color} p-2.5 rounded-xl font-medium transition-all active:scale-[0.98] shadow-lg text-sm">
            <i class="bi bi-send"></i> Send Part ${index + 1} <span class="text-xs opacity-75">(${partLength} chars)</span>
            </button>`;
        });
    }
}

async function sendPart(partNumber) {
    const button = document.getElementById(`sendBtn${partNumber}`);
    
    if (partNumber < 1 || partNumber > allParts.length) {
        return;
    }

    let partBlocks = allParts[partNumber - 1];
    
    if (!partBlocks || partBlocks.length === 0) {
        return;
    }

    let messageText = partBlocks.map(block => block.blockTextHtml).join("\n");
    
    if (messageText.length > 4096) {
        button.innerHTML = `<i class="bi bi-exclamation-triangle"></i> Too Long!`;
        button.className = "w-full bg-red-600 p-2.5 rounded-xl font-medium text-sm";
        return;
    }
    
    button.innerHTML = `<span class="spinner"></span> Sending...`;
    button.disabled = true;
    button.className = "w-full bg-yellow-600 p-2.5 rounded-xl font-medium text-sm";
    
    const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    try {
        const response = await fetch(telegramUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: CHANNEL_ID,
                text: messageText,
                parse_mode: 'HTML',
            })
        });

        const result = await response.json();

        if (result.ok) {
            button.innerHTML = `<i class="bi bi-check-circle"></i> Part ${partNumber} Sent!`;
            button.className = "w-full bg-emerald-600 p-2.5 rounded-xl font-medium text-sm";
            button.disabled = true;
        } else {
            button.innerHTML = `<i class="bi bi-exclamation-circle"></i> Failed`;
            button.className = "w-full bg-red-600 hover:bg-red-700 p-2.5 rounded-xl font-medium text-sm";
            button.disabled = false;
            alert(`Failed: ${result.description}`);
        }
    } catch (error) {
        console.error("Error sending to Telegram:", error);
        button.innerHTML = `<i class="bi bi-exclamation-circle"></i> Error`;
        button.className = "w-full bg-red-600 hover:bg-red-700 p-2.5 rounded-xl font-medium text-sm";
        button.disabled = false;
        alert(`Error: ${error.message}`);
    }
}

function copyAllText() {
    if (finalData.length === 0) return;
    
    let markdownText = finalData.join("\n");
    
    navigator.clipboard.writeText(markdownText).then(() => {
        const btn = document.getElementById("copyAllButton");
        btn.innerHTML = `<i class="bi bi-check-circle"></i> Copied!`;
        btn.className = "w-full bg-emerald-600 p-2.5 rounded-xl font-medium transition-all text-sm";
        setTimeout(() => {
            btn.innerHTML = `<i class="bi bi-clipboard-check"></i> Copy All`;
            btn.className = "w-full bg-[#1a1f2e] hover:bg-[#222838] border border-[#2d333b] p-2.5 rounded-xl font-medium transition-all text-sm";
        }, 2000);
    }).catch(err => {
        console.error("Copy failed:", err);
        alert("Copy failed!");
    });
}

loadUsers();
</script>

</body>
</html>
